name: Deploy na serwer

# Auto-deploy: po pushu na main laczymy sie z tailnetem i uruchamiamy
# /srv/story-report/deploy.sh na serwerze serwer (Tailscale Serve).
#
# Wymagane sekrety w repo (Settings -> Secrets and variables -> Actions):
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  - klient OAuth Tailscale z tagiem tag:ci
#   DEPLOY_HOST                            - adres serwera w tailnecie (adres-w-tailnecie)
#   DEPLOY_USER                            - deploy
#   DEPLOY_SSH_KEY                         - klucz prywatny klucz-ssh-z-sekretu
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Story.report
    runs-on: ubuntu-latest
    steps:
      - name: Polacz z tailnetem (Tailscale)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy przez SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" "sudo -n /srv/story-report/deploy.sh"
